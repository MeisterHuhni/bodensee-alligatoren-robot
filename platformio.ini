; =============================================================
; PlatformIO-Projektdatei – Bodensee Alligatoren
; =============================================================
; Diese Datei sagt PlatformIO, für welches Board wir bauen und
; mit welchem Framework. Zeilen mit ";" sind Kommentare.
;
; Wichtige Befehle (unten in der blauen Leiste von VS Code):
;   Häkchen   = Bauen (kompilieren)
;   Pfeil     = Bauen und auf den Teensy hochladen
;   Stecker   = Serieller Monitor (Ausgaben vom Teensy ansehen)
; =============================================================

[env:teensy40]
platform  = teensy        ; Plattform für alle Teensy-Boards
board     = teensy40      ; genau unser Board: Teensy 4.0
framework = arduino       ; wir programmieren mit dem Arduino-Framework

; Geschwindigkeit für den seriellen Monitor. Beim Teensy ist USB
; immer schnell, der Wert muss aber zu Serial.begin() in main.cpp passen.
monitor_speed = 115200

; -Wall zeigt mehr Warnungen an. Das hilft, Fehler früh zu finden.
build_flags = -Wall
